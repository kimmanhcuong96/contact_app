name: nexbook
description: Privacy-first encrypted personal contact manager.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  drift: ^2.22.1
  drift_flutter: ^0.2.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_saver: ^0.2.14
  image: ^4.3.0
  zxing2: ^0.2.3
  connectivity_plus: ^6.1.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
